[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "textile-procurement-agent"
version = "0.1.0"
description = "Human-assisted procurement workflow for Indian textile retailers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "langgraph-checkpoint-postgres>=2,<4",
    "openpyxl>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
