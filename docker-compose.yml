services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://procurement:procurement@db:5432/procurement
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://procurement:procurement@db:5432/procurement
      MEDIA_STORAGE_DIR: /app/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media

  worker:
    build: .
    command: python -m app.workers.main
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://procurement:procurement@db:5432/procurement
      MEDIA_STORAGE_DIR: /app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
